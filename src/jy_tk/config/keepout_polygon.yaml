polygon_keepout_mask_server:
  ros__parameters:
    use_sim_time: false

    map_topic: "/map"
    mask_topic: "/keepout_filter_mask"
    filter_info_topic: "/costmap_filter_info"

    # ★ 禁行区名称列表（每个名称对应下方 polygon_<name> 参数）
    polygons: ["zone_a", "zone_b"]

    # ---- 禁行区 A（原有）----
    polygon_zone_a: >-
      [[-4.66, 0.532],
       [-1.40, 1.10],
       [-1.71, -4.39],
       [-4.63, -4.30]]

    # ---- ★ 禁行区 B（新增，改成你实际要禁的坐标）----
    polygon_zone_b: >-
      [[1.09, -4.59],
       [1.03, -5.5],
       [-0.4, -5.5],
       [-0.4, -4.5]]

    inside_value: 100
    outside_value: 0