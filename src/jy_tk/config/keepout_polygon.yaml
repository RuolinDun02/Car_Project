polygon_keepout_mask_server:
  ros__parameters:
    use_sim_time: false

    map_topic: "/map"
    mask_topic: "/keepout_filter_mask"
    filter_info_topic: "/costmap_filter_info"

    # 必须保留为字符串，Python 节点会用 JSON 解析
    polygon_points: >-
      [[-4.66, 0.532],
       [-1.42, 0.234],
       [-1.51, -4.39],
       [-4.63, -4.30]]

    inside_value: 100
    outside_value: 0